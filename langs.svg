<svg xmlns="http://www.w3.org/2000/svg" width="495" height="240" viewBox="0 0 495 240">
<style>
  text { font-family: 'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace; }
  .t { fill: #a78bfa; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
  .l { fill: #8b7bb0; font-size: 13px; }
  .v { fill: #ede9fe; font-size: 13px; font-weight: 700; }
  .row { opacity: 0; animation: in .5s ease-out forwards; }
  @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  .scan { animation: sweep 5s linear infinite; }
  @keyframes sweep { from { transform: translateY(-30px); } to { transform: translateY(230px); } }
  .grow { transform-origin: 28px 0; transform: scaleX(0); animation: g 1.2s ease-out .2s forwards; }
  @keyframes g { to { transform: scaleX(1); } }</style>
