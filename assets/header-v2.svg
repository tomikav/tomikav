<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#160c26"/>
      <stop offset="60%" stop-color="#09060f"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="25%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="75%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rainbowLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8b5cf6"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="80%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.9  0 0 0 0.07 0"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font-family: 'Cinzel Decorative','Cinzel','Trajan Pro','Georgia','Times New Roman',serif; font-size: 96px; font-weight: 700; letter-spacing: 22px; }
      .mono  { font-family: 'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace; }
      .g1 { fill: #e11d48; opacity: .55; animation: g1 4s infinite steps(1); }
      .g2 { fill: #22d3ee; opacity: .45; animation: g2 4s infinite steps(1); }
      @keyframes g1 { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(-6px,2px); } 90% { transform: translate(5px,-3px); } 92% { transform: translate(-3px,0); } }
      @keyframes g2 { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(6px,-2px); } 90% { transform: translate(-5px,3px); } 92% { transform: translate(3px,1px); } }
      .cursor { animation: blink 1s infinite steps(1); }
      @keyframes blink { 50% { opacity: 0; } }
      .flicker { animation: fl 6s infinite; }
      @keyframes fl { 0%,47%,100% { opacity: 1; } 48% { opacity: .4; } 49% { opacity: 1; } 50% { opacity: .6; } 51% { opacity: 1; } }
      .sweep { animation: sw 7s linear infinite; }
      @keyframes sw { from { transform: translateY(-40px); } to { transform: translateY(360px); } }
      .a1 { animation: d1 14s ease-in-out infinite alternate; }
      .a2 { animation: d2 18s ease-in-out infinite alternate; }
      .a3 { animation: d3 16s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(140px, 40px); } }
      @keyframes d2 { to { transform: translate(-160px, -30px); } }
      @keyframes d3 { to { transform: translate(90px, -50px); } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#vignette)"/>

  <!-- aurora -->
  <g filter="url(#blur)" opacity=".55">
    <circle class="a1" cx="260" cy="120" r="120" fill="#7c3aed"/>
    <circle class="a2" cx="900" cy="200" r="130" fill="#db2777" opacity=".7"/>
    <circle class="a3" cx="600" cy="300" r="110" fill="#0891b2" opacity=".6"/>
  </g>

  <rect width="1200" height="320" filter="url(#noise)"/>

  <!-- corner brackets, one color each -->
  <g stroke-width="2" fill="none" opacity=".85">
    <path d="M30 60 V30 H60" stroke="#a78bfa"/>
    <path d="M1140 30 H1170 V60" stroke="#f472b6"/>
    <path d="M30 260 V290 H60" stroke="#22d3ee"/>
    <path d="M1140 290 H1170 V260" stroke="#4ade80"/>
  </g>

  <!-- top terminal line -->
  <text x="60" y="58" class="mono" font-size="15" fill="#6d5a8f">root@tomika<tspan fill="#f472b6">:~#</tspan> ./summon --silent<tspan class="cursor" fill="#22d3ee">█</tspan></text>
  <text x="1140" y="58" class="mono" font-size="13" text-anchor="end"><tspan fill="#4c3d66">[ </tspan><tspan fill="#4ade80">sys::online</tspan><tspan fill="#4c3d66"> ]  [ </tspan><tspan fill="#facc15">×64</tspan><tspan fill="#4c3d66"> ]</tspan></text>

  <!-- ornament -->
  <path d="M600 92 l6 8 -6 8 -6 -8z" fill="#f472b6"/>
  <rect x="360" y="99" width="210" height="1" fill="url(#rainbowLine)"/>
  <rect x="630" y="99" width="210" height="1" fill="url(#rainbowLine)"/>

  <!-- title with glitch layers + animated multicolor fill -->
  <g class="flicker">
    <text x="600" y="196" text-anchor="middle" class="title g1">TOMIKA</text>
    <text x="600" y="196" text-anchor="middle" class="title g2">TOMIKA</text>
    <text x="600" y="196" text-anchor="middle" class="title" fill="url(#titleGrad)" filter="url(#glow)">TOMIKA</text>
  </g>

  <rect x="300" y="222" width="600" height="1.5" fill="url(#rainbowLine)"/>
  <text x="600" y="254" text-anchor="middle" class="mono" font-size="17" letter-spacing="4" fill="#c4b5fd">SOFTWARE &amp; HARDWARE ARCHITECT</text>
  <text x="600" y="280" text-anchor="middle" class="mono" font-size="13" letter-spacing="3"><tspan fill="#5b4a7a">// </tspan><tspan fill="#22d3ee">code</tspan><tspan fill="#5b4a7a"> · </tspan><tspan fill="#4ade80">terminals</tspan><tspan fill="#5b4a7a"> · </tspan><tspan fill="#f472b6">mods</tspan><tspan fill="#5b4a7a"> · </tspan><tspan fill="#facc15">machines</tspan></text>

  <!-- scanlines + sweep -->
  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="1200" height="40" fill="#a78bfa" opacity=".03"/>
</svg>
