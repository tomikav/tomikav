<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="55%" stop-color="#0b0712"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.9  0 0 0 0.07 0"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font-family: 'Cinzel Decorative','Cinzel','Trajan Pro','Georgia','Times New Roman',serif; font-size: 96px; font-weight: 700; letter-spacing: 22px; }
      .mono  { font-family: 'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace; }
      .g1 { fill: #e11d48; opacity: .55; animation: g1 4s infinite steps(1); }
      .g2 { fill: #22d3ee; opacity: .45; animation: g2 4s infinite steps(1); }
      @keyframes g1 { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(-6px,2px); } 90% { transform: translate(5px,-3px); } 92% { transform: translate(-3px,0); } }
      @keyframes g2 { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(6px,-2px); } 90% { transform: translate(-5px,3px); } 92% { transform: translate(3px,1px); } }
      .cursor { animation: blink 1s infinite steps(1); }
      @keyframes blink { 50% { opacity: 0; } }
      .flicker { animation: fl 6s infinite; }
      @keyframes fl { 0%,100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: .4; } 49% { opacity: 1; } 50% { opacity: .6; } 51% { opacity: 1; } }
      .sweep { animation: sw 7s linear infinite; }
      @keyframes sw { from { transform: translateY(-40px); } to { transform: translateY(360px); } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#vignette)"/>
  <rect width="1200" height="320" filter="url(#noise)"/>

  <!-- corner brackets -->
  <g stroke="#8b5cf6" stroke-width="2" fill="none" opacity=".7">
    <path d="M30 60 V30 H60"/><path d="M1140 30 H1170 V60"/>
    <path d="M30 260 V290 H60"/><path d="M1140 290 H1170 V260"/>
  </g>

  <!-- top terminal line -->
  <text x="60" y="58" class="mono" font-size="15" fill="#6d5a8f">root@tomika<tspan fill="#a78bfa">:~#</tspan> ./summon --silent<tspan class="cursor" fill="#a78bfa">█</tspan></text>
  <text x="1140" y="58" class="mono" font-size="13" fill="#4c3d66" text-anchor="end">[ sys::online ]  [ ×64 ]</text>

  <!-- ornament -->
  <g fill="#a78bfa" opacity=".8">
    <path d="M600 92 l6 8 -6 8 -6 -8z"/>
  </g>
  <rect x="360" y="99" width="210" height="1" fill="url(#line)"/>
  <rect x="630" y="99" width="210" height="1" fill="url(#line)"/>

  <!-- title with glitch layers -->
  <g class="flicker">
    <text x="600" y="196" text-anchor="middle" class="title g1">TOMIKA</text>
    <text x="600" y="196" text-anchor="middle" class="title g2">TOMIKA</text>
    <text x="600" y="196" text-anchor="middle" class="title" fill="#ede9fe" filter="url(#glow)">TOMIKA</text>
  </g>

  <rect x="300" y="222" width="600" height="1" fill="url(#line)"/>
  <text x="600" y="254" text-anchor="middle" class="mono" font-size="17" letter-spacing="4" fill="#a78bfa">SOFTWARE &amp; HARDWARE ARCHITECT</text>
  <text x="600" y="280" text-anchor="middle" class="mono" font-size="13" letter-spacing="3" fill="#5b4a7a">// code · terminals · mods · machines</text>

  <!-- scanlines + sweep -->
  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="1200" height="40" fill="#a78bfa" opacity=".03"/>
</svg>
