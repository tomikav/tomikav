<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#11132e"/>
      <stop offset="60%" stop-color="#080919"/>
      <stop offset="100%" stop-color="#020104"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="25%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="75%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rainbowLine" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8b5cf6"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="60%" stop-color="#22d3ee"/>
      <stop offset="80%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.9  0 0 0 0.07 0"/>
    </filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font-family: 'Cinzel Decorative','Cinzel','Trajan Pro','Georgia','Times New Roman',serif; font-size: 96px; font-weight: 700; letter-spacing: 22px; }
      .mono  { font-family: 'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'DejaVu Sans Mono',monospace; }

      /* ── power-on timeline ── */
      @keyframes on   { from { opacity: 0; } to { opacity: 1; } }
      @keyframes onA  { from { opacity: 0; } to { opacity: .6; } }
      @keyframes onG  { from { opacity: 0; } to { opacity: .5; } }
      .s  { opacity: 0; animation: on 2s ease-in forwards; }
      .b1 { animation-delay: 1s; }   .b2 { animation-delay: 1.6s; }
      .b3 { animation-delay: 2.2s; } .b4 { animation-delay: 2.8s; }
      .ghost  { opacity: 0; animation: on 3s ease-out 1.5s forwards; }
      .lit    { opacity: 0; animation: on 8s ease-in 12s forwards; }
      .lines  { opacity: 0; animation: on 4s ease-in 9s forwards; }
      .sub    { opacity: 0; animation: on 3s ease-in 11s forwards; }
      .tags   { opacity: 0; animation: on 3s ease-in 13s forwards; }
      .stat   { opacity: 0; animation: on 2s ease-in 14s forwards; }
      .aurora { opacity: 0; animation: onA 16s ease-in 4s forwards; }

      .g1 { fill: #e11d48; opacity: 0; animation: onG 1s ease 20s forwards, g1 4s steps(1) 20s infinite; }
      .g2 { fill: #22d3ee; opacity: 0; animation: onG 1s ease 20s forwards, g2 4s steps(1) 20s infinite; }
      @keyframes g1 { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(-6px,2px); } 90% { transform: translate(5px,-3px); } 92% { transform: translate(-3px,0); } }
      @keyframes g2 { 0%,86%,100% { transform: translate(0,0); } 88% { transform: translate(6px,-2px); } 90% { transform: translate(-5px,3px); } 92% { transform: translate(3px,1px); } }

      .cursor { animation: blink 1s infinite steps(1); }
      @keyframes blink { 50% { opacity: 0; } }
      .sweep { animation: sw 7s linear infinite; }
      @keyframes sw { from { transform: translateY(-40px); } to { transform: translateY(460px); } }
      .a1 { animation: d1 14s ease-in-out infinite alternate; }
      .a2 { animation: d2 18s ease-in-out infinite alternate; }
      .a3 { animation: d3 16s ease-in-out infinite alternate; }
      @keyframes d1 { to { transform: translate(140px, 40px); } }
      @keyframes d2 { to { transform: translate(-160px, -30px); } }
      @keyframes d3 { to { transform: translate(90px, -50px); } }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#vignette)"/>

  <!-- aurora: fades in slowly, then keeps cycling RGB -->
  <g class="aurora" filter="url(#blur)">
    <circle class="a1" cx="260" cy="150" r="150" fill="#4f46e5">
      <animate attributeName="fill" values="#4f46e5;#7c3aed;#db2777;#0891b2;#4f46e5" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle class="a2" cx="900" cy="260" r="160" fill="#6366f1" opacity=".7">
      <animate attributeName="fill" values="#6366f1;#db2777;#0891b2;#ca8a04;#6366f1" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle class="a3" cx="600" cy="400" r="130" fill="#3730a3" opacity=".6">
      <animate attributeName="fill" values="#3730a3;#0891b2;#7c3aed;#3730a3" dur="20s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1200" height="420" filter="url(#noise)"/>

  <!-- corner brackets light up one by one -->
  <g stroke-width="2" fill="none">
    <path class="s b1" d="M30 60 V30 H60" stroke="#a78bfa"/>
    <path class="s b2" d="M1140 30 H1170 V60" stroke="#f472b6"/>
    <path class="s b3" d="M1140 390 H1170 V360" stroke="#4ade80"/>
    <path class="s b4" d="M30 360 V390 H60" stroke="#22d3ee"/>
  </g>

  <!-- terminal line is the only thing alive at first -->
  <text x="60" y="58" class="mono" font-size="15" fill="#4c3d66">root@tomika<tspan fill="#6d5a8f">:~#</tspan> ./summon --silent<tspan class="cursor" fill="#a78bfa">█</tspan></text>
  <text x="1140" y="58" class="mono stat" font-size="13" text-anchor="end"><tspan fill="#4c3d66">[ </tspan><tspan fill="#4ade80">sys::online</tspan><tspan fill="#4c3d66"> ]  [ </tspan><tspan fill="#facc15">×64</tspan><tspan fill="#4c3d66"> ]</tspan></text>

  <g transform="translate(600 222) scale(1.3) translate(-600 -185)">
  <!-- ornament + lines -->
  <g class="lines">
    <path d="M600 92 l6 8 -6 8 -6 -8z" fill="#f472b6"/>
    <rect x="360" y="99" width="210" height="1" fill="url(#rainbowLine)"/>
    <rect x="630" y="99" width="210" height="1" fill="url(#rainbowLine)"/>
    <rect x="300" y="222" width="600" height="1.5" fill="url(#rainbowLine)"/>
  </g>

  <!-- title: dark ghost first, then RGB fill, then glitch -->
  <text x="600" y="196" text-anchor="middle" class="title ghost" fill="#fef9c3" filter="url(#glow)">TOMIKA<animate attributeName="fill" values="#fef9c3;#fef9c3;#e0e7ff;#a5b4fc" keyTimes="0;.35;.7;1" dur="12s" fill="freeze"/></text>
  <text x="600" y="196" text-anchor="middle" class="title g1">TOMIKA</text>
  <text x="600" y="196" text-anchor="middle" class="title g2">TOMIKA</text>
  <text x="600" y="196" text-anchor="middle" class="title lit" fill="url(#titleGrad)" filter="url(#glow)">TOMIKA</text>

  <text x="600" y="254" text-anchor="middle" class="mono sub" font-size="17" letter-spacing="4" fill="#c4b5fd">SOFTWARE &amp; HARDWARE ARCHITECT</text>
  <text x="600" y="280" text-anchor="middle" class="mono tags" font-size="13" letter-spacing="3"><tspan fill="#5b4a7a">// </tspan><tspan fill="#22d3ee">code</tspan><tspan fill="#5b4a7a"> · </tspan><tspan fill="#4ade80">terminals</tspan><tspan fill="#5b4a7a"> · </tspan><tspan fill="#f472b6">mods</tspan><tspan fill="#5b4a7a"> · </tspan><tspan fill="#facc15">machines</tspan></text>

  </g>

  <rect width="1200" height="420" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="0" width="1200" height="40" fill="#a78bfa" opacity=".03"/>
</svg>
