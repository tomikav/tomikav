<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .m { font-family: 'Cascadia Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; }
      .c { animation: b 1s infinite steps(1); } @keyframes b { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect x="200" y="20" width="800" height="1" fill="url(#l)"/>
  <text x="600" y="55" text-anchor="middle" class="m" font-size="14" letter-spacing="4" fill="#6d5a8f">[ END OF TRANSMISSION ]<tspan class="c" fill="#a78bfa"> █</tspan></text>
</svg>
