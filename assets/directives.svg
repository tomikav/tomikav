lass="m" font-size="10.5" fill="#f0abfc" letter-spacing="1.5">CONCEPT</text><text x="535.0" y="92.5" class="s" font-size="14.5" fill="#a89bc4">Surface EMG wearable for motor</text><text x="535.0" y="113.5" class="s" font-size="14.5" fill="#a89bc4">rehab and gesture recognition.</text><rect x="535.0" y="136.5" width="78" height="22" rx="11" fill="#17121f" stroke="#2a2140"/><text x="574.2" y="151.5" text-anchor="middle" class="m" font-size="11.5" fill="#d8ccf0">Hardware</text><rect x="620.4" y="136.5" width="71" height="22" rx="11" fill="#17121f" stroke="#2a2140"/><text x="655.9" y="151.5" text-anchor="middle" class="m" font-size="11.5" fill="#d8ccf0">Signals</text><rect x="698.5" y="136.5" width="86" height="22" rx="11" fill="#17121f" stroke="#2a2140"/><text x="741.4" y="151.5" text-anchor="middle" class="m" font-size="11.5" fill="#d8ccf0">Wearables</text></g><g class="c2"><rect x="0.5" y="194.5" width="490.5" height="176" rx="14" fill="#0e0b16" stroke="#2a2140"/><rect x="0.5" y="216.5" width="3" height="40" rx="1.5" fill="#67e8f9"/><text x="26.5" y="232.5" class="m" font-size="12" fill="#5b4a7a" letter-spacing="2">03</text><text x="26.5" y="254.5" class="s" font-size="20" font-weight="700" fill="#f5f3ff">Source 2 Modding &amp; CV</text><rect x="410.2" y="216.5" width="56.8" height="22" rx="11" fill="none" stroke="#67e8f9" stroke-opacity=".55"/><circle cx="423.2" cy="227.5" r="3" fill="#67e8f9" class="led"/><text x="433.2" y="231.5" class="m" font-size="10.5" fill="#67e8f9" letter-spacing="1.5">R&amp;D</text><text x="26.5" y="286.5" class="s" font-size="14.5" fill="#a89bc4">Source2Viewer extraction, Blender</text><text x="26.5" y="307.5" class="s" font-size="14.5" fill="#a89bc4">pipeline, hand &amp; face tracking.</text><rect x="26.5" y="330.5" width="78" height="22" rx="11" fill="#17121f" stroke="#2a2140"/><text x="65.7" y="345.5" text-anchor="middle" class="m" font-size="11.5" fill="#d8ccf0">Source 2</text><rect x="111.9" y="330.5" width="71" height="22" rx="11" fill="#17121f" stroke="#2a2140"/><text x="147.4" y="345.5" text-anchor="middle" class="m" font-size="11.5" fill="#d8ccf0">Blender</text><rect x="190.0" y="330.5" width="64" height="22" rx="11" fill="#17121f" stroke="#2a2140"/><text x="221.9" y="345.5" text-anchor="middle" class="m" font-size="11.5" fill="#d8ccf0">Python</text></g><g class="c3"><rect x="509.0" y="194.5" width="490.5" height="176" rx="14" fill="#0e0b16" stroke="#2a2140"/><rect x="509.0" y="216.5" width="3" height="40" rx="1.5" fill="#818cf8"/><text x="535.0" y="232.5" class="m" font-size="12" fill="#5b4a7a" letter-spacing="2">04</text><text x="535.0" y="254.5" class="s" font-size="20" font-weight="700" fill="#f5f3ff">Cybersecurity</text><rect x="895.9" y="216.5" width="79.6" height="22" rx="11" fill="none" stroke="#818cf8" stroke-opacity=".55"/><circle cx="908.9" cy="227.5" r="3" fill="#818cf8" class="led"/><text x="918.9" y="231.5" class="m" font-size="10.5" fill="#818cf8" letter-spacing="1.5">ACTIVE</text><text x="535.0" y="286.5" class="s" font-size="14.5" fill="#a89bc4">Vulnerability assessment and</text><text x="535.0" y="307.5" class="s" font-size="14.5" fill="#a89bc4">threat analysis in Linux labs.</text><rect x="535.0" y="330.5" width="49" height="22" rx="11" fill="#17121f" stroke="#2a2140"/><text x="559.6" y="345.5" text-anchor="middle" class="m" font-size="11.5" fill="#d8ccf0">Kali</text><rect x="591.2" y="330.5" width="56" height="22" rx="11" fill="#17121f" stroke="#2a2140"/><text x="619.5" y="345.5" text-anchor="middle" class="m" font-size="11.5" fill="#d8ccf0">Linux</text><rect x="654.7" y="330.5" width="78" height="22" rx="11" fill="#17121f" stroke="#2a2140"/><text x="693.9" y="345.5" text-anchor="middle" class="m" font-size="11.5" fill="#d8ccf0">Networks</text></g>
