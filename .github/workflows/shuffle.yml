name: rotate theme

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotate-theme
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pick a random theme
        id: pick
        run: |
          current=$(grep -o 'theme:[a-z]*' README.md | head -1 | cut -d: -f2)
          choices=()
          for t in gothic frost crimson toxic sakura; do
            [ "$t" != "$current" ] && choices+=("$t")
          done
          next=${choices[$RANDOM % ${#choices[@]}]}
          cp "themes/$next.md" README.md
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "theme: ${{ steps.pick.outputs.next }}"
          git push
