name: shuffle theme

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: shuffle-theme
  cancel-in-progress: false

jobs:
  shuffle:
    if: contains(github.event.issue.title, 'shuffle')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pick a random theme
        id: pick
        run: |
          current=$(grep -o 'theme:[a-z]*' README.md | head -1 | cut -d: -f2)
          choices=()
          for t in gothic frost crimson toxic sakura; do
            [ "$t" != "$current" ] && choices+=("$t")
          done
          next=${choices[$RANDOM % ${#choices[@]}]}
          cp "themes/$next.md" README.md
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "theme: ${{ steps.pick.outputs.next }}"
          git push

      - name: reply and close
        uses: actions/github-script@v7
        env:
          NEXT: ${{ steps.pick.outputs.next }}
        with:
          script: |
            const t = process.env.NEXT;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `⤨ Theme switched to **${t}**. Head back to the profile: https://github.com/${context.repo.owner}`
            });
            await github.rest.issues.update({
              ...context.repo, issue_number: context.issue.number,
              state: 'closed', state_reason: 'completed'
            });
